name = "cloudflare-light-blog"
main = "src/worker.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# ============================================
# 静态资源配置
# ============================================
[assets]
directory = "./public"
binding = "ASSETS"

# ============================================
# D1 数据库绑定（变量名必须为 DB）
# Cloudflare 会根据 database_name 自动查找对应的数据库
# 如果报错 "database not found"，请先在 D1 面板创建名为 blog-db 的数据库
# ============================================
[[d1_databases]]
binding = "DB"
database_name = "blog-db"
migrations_dir = "migrations"

# ============================================
# R2 存储绑定（可选，如需图片上传功能）
# Workers & Pages > 你的 Worker > Settings > Bindings > Add > R2 Bucket
# 变量名填 R2，选择你创建的 blog-images 存储桶
# ============================================
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "blog-images"

# CORS 配置已迁移至后台网站设置中
# [vars]
# ALLOWED_ORIGIN = "*"

[observability]
enabled = true

[observability.logs]
enabled = true
persist = true
invocation_logs = true
